name: balloon_hunter
description: "Balloon Hunter - Casual arcade game built with Flutter & Flame Engine"
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.38.0
  flame_audio: ^2.10.0

  # Audio
  audioplayers: ^6.8.1

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Sharing
  share_plus: ^10.0.0

  # Haptics
  vibration: ^3.2.0

  # UI Animations
  flutter_animate: ^4.5.2

  # Typography
  google_fonts: ^6.2.1

  # Utils
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.0.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^6.1.5
  font_awesome_flutter: ^11.0.0
  flutter_facebook_auth: ^7.2.0
  games_services: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/particles/
    - assets/images/ui/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000" # o un color base del juego
  adaptive_icon_foreground: "app_icon.png"
